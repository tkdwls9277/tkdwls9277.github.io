<!DOCTYPE html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Flashcard Quiz</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <h1>Flashcard&nbsp;Quiz</h1>

    <!-- 🆕 문제집 선택 -->
    <div class="selector">
      <label for="test-select">문제집 선택:</label>
      <select id="test-select"></select>
    </div>

    <!-- 진행률 바 -->
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>

    <!-- 플래시카드 -->
    <div id="card" class="card">
      <div class="card-inner">
        <div id="card-front" class="card-face card-front"></div>
        <div id="card-back" class="card-face card-back"></div>
      </div>
    </div>

    <div class="controls">
      <button id="flip-btn">정답 보기 / 가리기</button>
      <button id="next-btn">다음 문제</button>
    </div>

    <script src="script.js"></script>
  </body>
</html>
